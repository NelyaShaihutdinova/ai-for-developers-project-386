openapi: 3.0.0
info:
  title: Calendar Booking API
  version: 0.0.0
tags: []
paths:
  /api/bookings:
    get:
      operationId: Bookings_list
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookingWithTypeName'
    post:
      operationId: Bookings_create
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                body:
                  $ref: '#/components/schemas/BookingCreate'
              required:
                - body
  /api/meeting-types:
    get:
      operationId: MeetingTypes_list
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MeetingType'
    post:
      operationId: MeetingTypes_create
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingType'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                body:
                  $ref: '#/components/schemas/MeetingTypeCreate'
              required:
                - body
  /api/meeting-types/{id}:
    get:
      operationId: MeetingTypes_getById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/MeetingType'
                  - $ref: '#/components/schemas/NotFound'
    patch:
      operationId: MeetingTypes_update
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/MeetingType'
                  - $ref: '#/components/schemas/NotFound'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                body:
                  $ref: '#/components/schemas/MeetingTypeUpdate'
              required:
                - body
    post:
      operationId: MeetingTypes_deactivate
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/MeetingType'
                  - $ref: '#/components/schemas/NotFound'
  /api/slots:
    get:
      operationId: Slots_list
      parameters:
        - name: meetingTypeId
          in: query
          required: true
          schema:
            type: integer
            format: int32
          explode: false
        - name: date
          in: query
          required: true
          schema:
            type: string
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                anyOf:
                  - type: array
                    items:
                      $ref: '#/components/schemas/Slot'
                  - $ref: '#/components/schemas/NotFound'
components:
  schemas:
    Booking:
      type: object
      required:
        - id
        - meetingTypeId
        - startAt
        - endAt
        - guestName
        - guestEmail
        - createdAt
      properties:
        id:
          type: integer
          format: int32
        meetingTypeId:
          type: integer
          format: int32
        startAt:
          type: string
        endAt:
          type: string
        guestName:
          type: string
        guestEmail:
          type: string
        createdAt:
          type: string
    BookingCreate:
      type: object
      required:
        - meetingTypeId
        - startAt
        - guestName
        - guestEmail
      properties:
        meetingTypeId:
          type: integer
          format: int32
        startAt:
          type: string
        guestName:
          type: string
        guestEmail:
          type: string
    BookingWithTypeName:
      type: object
      required:
        - id
        - meetingTypeId
        - meetingTypeName
        - startAt
        - endAt
        - guestName
        - guestEmail
        - createdAt
      properties:
        id:
          type: integer
          format: int32
        meetingTypeId:
          type: integer
          format: int32
        meetingTypeName:
          type: string
        startAt:
          type: string
        endAt:
          type: string
        guestName:
          type: string
        guestEmail:
          type: string
        createdAt:
          type: string
    Error:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorResponse'
    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
    MeetingType:
      type: object
      required:
        - id
        - name
        - description
        - durationMinutes
        - isActive
        - createdAt
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
        description:
          type: string
        durationMinutes:
          type: integer
          format: int32
        isActive:
          type: boolean
        createdAt:
          type: string
    MeetingTypeCreate:
      type: object
      required:
        - name
        - description
        - durationMinutes
      properties:
        name:
          type: string
        description:
          type: string
        durationMinutes:
          type: integer
          format: int32
    MeetingTypeUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        durationMinutes:
          type: integer
          format: int32
    NotFound:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                - NOT_FOUND
            message:
              type: string
              enum:
                - Meeting type not found
          required:
            - code
            - message
    Slot:
      type: object
      required:
        - startAt
        - endAt
      properties:
        startAt:
          type: string
        endAt:
          type: string
servers:
  - url: http://localhost:3000
    description: Development server
    variables: {}
