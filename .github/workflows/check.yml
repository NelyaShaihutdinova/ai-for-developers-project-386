name: check

on:
  push:
    branches: ['**']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            **/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: mise run install

      - name: Generate API SDK
        run: mise run generate:api

      - name: Verify SDK matches spec
        run: |
          if [ -n "$(git status --porcelain frontend/src/api/generated/)" ]; then
            echo "Generated SDK is out of sync with OpenAPI spec."
            echo "Run 'mise run generate:api' locally and commit the changes."
            git diff frontend/src/api/generated/
            exit 1
          fi

      - name: Run checks
        run: mise run check
